<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitações — Admin | GirottoWebSites</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&lt;/&gt;</text></svg>">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="bg-code-layer" aria-hidden="true"></div>

<div class="container admin-shell">
  <div class="admin-topbar">
    <div>
      <h1>Solicitações de orçamento</h1>
      <p class="user-email" id="user-email"></p>
    </div>
    <button class="btn btn-ghost" id="logout-btn" type="button">Sair</button>
  </div>

  <p class="admin-state" id="admin-state">Carregando...</p>

  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Recebido em</th>
          <th>Nome</th>
          <th>E-mail</th>
          <th>WhatsApp</th>
          <th>Projeto</th>
          <th>Mensagem</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="solicitacoes-body"></tbody>
    </table>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
